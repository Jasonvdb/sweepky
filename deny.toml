# cargo-deny configuration, checked by `cargo deny check` locally and in CI.
# Written for cargo-deny 0.19.9; any key left out takes the tool's default.
# Reference: https://embarkstudios.github.io/cargo-deny/

# Which part of the dependency graph every check below looks at.
[graph]
# Only the platforms Sweepky is built and tested on: CI's Linux runners and
# macOS on both architectures. Without this list cargo-deny checks every
# target-specific dependency of every crate, for every platform Rust knows,
# including ones nothing here is ever compiled for. Add a target here before
# shipping a build for it, so its dependencies are checked too.
#
# One effect: `atomic-polyfill` (RUSTSEC-2023-0089, unmaintained) drops out of
# the graph. It comes in through pubky-common -> postcard -> heapless 0.7,
# which depends on it only for avr, riscv32 (the `-none-elf` targets),
# thumbv6m and xtensa, none of them a Sweepky platform. If a target that needs
# it is ever added, the advisory comes back and has to be dealt with then.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

# `cargo deny check advisories`: fail on crates with a RustSec advisory.
# The database is fetched read-only from github.com/rustsec/advisory-db.
[advisories]
# With the defaults kept here, a vulnerability advisory always fails the check,
# an unmaintained one fails for any crate in the graph, and an unsound one fails
# for our direct dependencies. To accept one, list it here with a reason:
# { id = "RUSTSEC-0000-0000", reason = "..." }. Never ignore without a reason,
# and say when the entry can go.
ignore = [
    # quick-xml 0.39.4, two denial-of-service bugs when parsing untrusted XML
    # (a quadratic duplicate-attribute check, and unbounded namespace
    # declarations). Dev-only: it reaches the graph solely through the
    # pubky-testnet dev-dependency -> pubky-homeserver 0.16.2 -> opendal 0.57
    # -> opendal-core 0.57.0, which requires quick-xml ^0.39.3, and the
    # `sweepky` binary never contains it (`cargo tree -p sweepky-cli
    # -e normal --target all -i quick-xml` prints nothing). The fix is in
    # quick-xml 0.41, which needs opendal-core 0.58, and pubky-homeserver's
    # `opendal = "0.57"` excludes that. The tests' homeserver keeps its files
    # in memory (pubky-homeserver's test config) and its index in a local
    # Postgres, so it parses no XML from anyone. Remove both entries when
    # pubky-testnet moves to opendal 0.58 or later.
    { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.39.4, dev-only via pubky-testnet -> pubky-homeserver -> opendal-core 0.57; the fix (0.41) needs opendal-core 0.58, which pubky-homeserver 0.16.2 excludes" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.39.4, dev-only via pubky-testnet -> pubky-homeserver -> opendal-core 0.57; the fix (0.41) needs opendal-core 0.58, which pubky-homeserver 0.16.2 excludes" },
    # basic-toml 0.1.10, a small TOML parser, unmaintained: its repository was
    # archived in March 2025 and the advisory names no safe upgrade. It reaches
    # the graph solely through age 0.12.1's localisation proc-macros, on two
    # paths: age -> i18n-embed-fl 0.10.1 (proc-macro) -> i18n-config 0.4.8 ->
    # basic-toml, and age -> i18n-embed 0.16.0 -> i18n-embed-impl 0.8.4
    # (proc-macro) -> i18n-config 0.4.8 -> basic-toml. A proc-macro runs inside
    # the compiler on the machine that builds Sweepky and is never linked into
    # what it builds, so the `sweepky` binary never contains basic-toml
    # (`cargo tree -p sweepky-cli -e normal,no-proc-macro --target all
    # -i basic-toml` prints nothing). While age compiles, the macros use it to
    # parse one file, the `i18n.toml` shipped inside the age crate (checked
    # against Cargo.lock's checksum), so nothing from a user or the network
    # ever reaches it. Every crate on both paths is at its newest release and
    # i18n-config 0.4.8 still requires basic-toml, so no `cargo update` can drop
    # it. Remove this entry when age moves off i18n-embed-fl and i18n-config,
    # or when i18n-config drops basic-toml.
    { id = "RUSTSEC-2026-0374", reason = "basic-toml 0.1.10 (unmaintained), compile-time only via age 0.12.1's localisation proc-macros -> i18n-config 0.4.8; it parses only age's own i18n.toml and is not in the sweepky binary" },
]
# A yanked release was withdrawn by its author, often for a bug, so depending on
# one fails the check instead of only warning (the default).
yanked = "deny"

# `cargo deny check licenses`: every crate in the graph, our own included, must
# carry a licence on this list.
[licenses]
# Check dev-dependencies too. cargo-deny skips them by default because they are
# not part of the shipped binary, but we still download, build and run them on
# our machines and in CI. `option-ext` below arrives only through the
# pubky-testnet dev-dependency, so without this its exception would never apply.
include-dev = true
# SPDX ids. A crate passes when its licence expression is satisfied by these:
# `MIT OR Apache-2.0` passes with either, `MIT AND X` needs both.
#
# From P1a, sweepky-core's serde, serde_json and thiserror (and the crates they
# pull in) use MIT, Apache-2.0 and Unicode-3.0 (unicode-ident's
# `(MIT OR Apache-2.0) AND Unicode-3.0`). From P1b, `age` adds BSD-2-Clause
# (zerocopy), BSD-3-Clause (x25519-dalek, curve25519-dalek and subtle) and
# more Unicode-3.0 (tinystr). From P2a, `pubky` and the `pubky-testnet`
# dev-dependency add ISC (ring, rustls, rustls-webpki, untrusted and others),
# Zlib (foldhash), CDLA-Permissive-2.0 (webpki-roots) and the `option-ext`
# exception below. With them in, `cargo deny check licenses` passes and warns
# about no entry it did not encounter, so all eight entries and the exception
# are in use; drop any entry it later reports as not encountered.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # webpki-roots (Mozilla's root certificates), a direct dependency of pubky.
    "CDLA-Permissive-2.0",
]
# Per-crate exceptions, so a licence is accepted for one crate only rather than
# for everything that might arrive later.
exceptions = [
    # Pulled in through pubky-testnet. MPL-2.0 is copyleft per file, so it is
    # allowed for this crate alone and never added to `allow` above.
    { crate = "option-ext", allow = ["MPL-2.0"] },
]

# `cargo deny check bans`: rules on which crates and versions may appear.
[bans]
# Two versions of one crate in the graph cost build time and binary size but are
# common in a large tree, so they warn instead of failing.
multiple-versions = "warn"

# `cargo deny check sources`: where crates may come from.
[sources]
# crates.io only (cargo-deny's default `allow-registry`). Any other registry or
# any `git = "..."` dependency fails the check, so every crate is a published
# crates.io release: one the advisory and yanked checks above can see.
unknown-registry = "deny"
unknown-git = "deny"
