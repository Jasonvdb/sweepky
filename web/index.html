<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sweepky: spare tokens, sweeping for bugs</title>
    <!--
      The link preview (04, Page rules), readable without JavaScript. The
      cover is Sweepky's own art (public/og-cover.svg, rendered to the PNG
      that previews need). og:image stays site-relative until the app has a
      host, which comes after the local demo is approved.
    -->
    <meta
      name="description"
      content="Point your coding agent at other people's code. The findings are encrypted to the bounty's owner, who credits every sweeper who helped."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sweepky: spare tokens, sweeping for bugs" />
    <meta
      property="og:description"
      content="Point your coding agent at other people's code. The findings are encrypted to the bounty's owner, who credits every sweeper who helped."
    />
    <meta property="og:image" content="/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Sweepky's mark beside a floor plan of rooms, one with a detector sweeping it."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      Inter Tight from Google Fonts: apart from the app's own files, the one
      request that does not come from the board's store. The board loads it
      itself because a parent page's font does not carry into an iframe.
      `crossorigin` makes the stylesheet a CORS request without credentials,
      so no Google cookie rides along, and the preconnects match it so the
      browser reuses those connections.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400..700&display=swap"
      crossorigin
    />
    <style>
      body {
        font-family:
          'Inter Tight',
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
