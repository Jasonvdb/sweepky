<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Sweepky's mark (src/components/Mark.tsx) on a transparent background,
       as sRGB hex: a favicon is drawn outside the page's CSS. The brand amber
       #ffb336 on a dark tab bar; on a light one it falls to about 1.8:1, so
       the light scheme draws it in a darker amber, #b66c00, which clears 3:1
       on white and on light grey tab bars. No double hyphen in this comment:
       XML forbids one, and the browser then drops the whole icon.
       favicon.ico and apple-touch-icon.png are rendered from this file by
       scripts/render-icons.mjs. -->
  <style>
    .mark { color: #ffb336; }
    @media (prefers-color-scheme: light) {
      .mark { color: #b66c00; }
    }
  </style>
  <g class="mark">
    <circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="2.5"/>
    <path d="M16 16 L16 5 A11 11 0 0 1 25.5 10.5 Z" fill="currentColor"/>
    <circle cx="16" cy="16" r="2.5" fill="currentColor"/>
  </g>
</svg>
