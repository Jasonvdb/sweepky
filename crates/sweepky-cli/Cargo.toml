[package]
name = "sweepky-cli"
description = "The sweepky command-line tool"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The crate is a library plus a thin binary. The library (`src/lib.rs`, which
# Cargo finds on its own and names `sweepky_cli`) runs every command given a
# network config, so the end-to-end test can call it with a local testnet's
# client injected. The binary only parses the arguments, reads the environment,
# builds that config and prints the result.
#
# The package is `sweepky-cli`, but the binary people run is `sweepky`.
[[bin]]
name = "sweepky"
path = "src/main.rs"

# Each entry opts in to a pin in the root Cargo.toml's [workspace.dependencies].
#
# Errors: `anyhow` is for this crate only, library and binary alike, because
# here an error only has to become a good message for the user. sweepky-core
# returns typed `thiserror` errors that code can `match` on.
[dependencies]
# Records, ids, paths and encryption, with no network or file I/O.
sweepky-core = { path = "../sweepky-core" }
# The Pubky SDK. The workspace entry turns on its `json` feature. `pull`'s
# host policy reads pkarr records through its `pkarr` re-export (and
# simple-dns through pkarr's `dns`), so neither needs a line of its own: each
# stays the release this pubky brings in, as Cargo.lock holds it.
pubky = { workspace = true }
# Argument parsing. `derive` adds `#[derive(Parser)]`; clap's default features
# stay on. Never `env`: only main.rs reads environment variables, with
# `std::env::var_os`, and passes the values in, so nothing else can be
# configured behind the caller's back.
clap = { workspace = true, features = ["derive"] }
# The async runtime: `rt-multi-thread` for `#[tokio::main]`'s default runtime,
# `macros` for `#[tokio::main]` itself, `time` for timeouts, `process` and
# `io-util` for the git runner's child processes and its bounded reads of
# their output, and `net` for `lookup_host`, through which the host policy
# resolves a target's host. pubky already turns all of them on in this build
# (it asks for tokio's `full` on every target but wasm; `cargo tree -e
# features -i tokio`), so naming them adds no code; it keeps this crate
# building if pubky ever stops.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "process", "io-util", "net"] }
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# The writers' lock: an exclusive `flock` on `credential.lock`, made through
# rustix, so this crate needs no `unsafe` and no `libc` of its own for it.
fd-lock = { workspace = true }
# `submit`'s walk of the sweep directory the agent wrote: `openat` with
# O_NOFOLLOW, `statat` with AT_SYMLINK_NOFOLLOW and `fstat`, each relative
# to an open directory handle, so no link is ever followed and nothing can
# be swapped in between a check and an open. `fs` is the feature with those
# calls; fd-lock already turns it on, so it adds no code.
rustix = { workspace = true, features = ["fs"] }
# The `Url` the SDK's transport URLs come in, named here so the directory
# listing can add its query and parse `https://` listing lines. The release
# pubky itself uses, so it adds no code.
url = { workspace = true }
# The QR codes of the Pubky Ring sign-in (P2d): the sign-in page's, as an
# inline SVG, and the terminal's, in block characters. The workspace entry
# turns defaults off and only `svg` on, so qrcode's image stack stays out;
# its terminal renderer needs no feature. With these features qrcode has no
# dependencies of its own.
qrcode = { workspace = true }

# Crates for this crate's own tests only; none of them reaches the binary.
[dev-dependencies]
# A local Pubky network (DHT, pkarr relay, HTTP relay and a homeserver) for the
# end-to-end test. Its homeserver needs Postgres through
# TEST_PUBKY_CONNECTION_STRING.
pubky-testnet = { workspace = true }
# `#[tokio::test]` needs `macros` and `rt-multi-thread`, named here so the
# tests keep them even if the library's own list changes. `sync` adds the
# oneshot channel and the barrier the writers' lock tests coordinate with.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
# Temporary directories that delete themselves when the test ends.
tempfile = { workspace = true }
