[package]
name = "sweepky-core"
description = "Sweepky's records, ids, paths and encryption, with no network or file I/O"
# `field.workspace = true` inherits the value from [workspace.package] in the
# root Cargo.toml.
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# No dependencies yet. Later phases opt in to the pins in the root Cargo.toml
# with `name = { workspace = true }`. This crate never takes `pubky`, `tokio`
# or `reqwest`: the CLI owns the network.
[dependencies]
