[package]
name = "sweepky-core"
description = "Sweepky's records, ids, paths and encryption, with no network or file I/O"
# `field.workspace = true` inherits the value from [workspace.package] in the
# root Cargo.toml.
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Each entry opts in to a pin in the root Cargo.toml's [workspace.dependencies];
# `features` adds to what the workspace entry turns on. This crate never takes
# `pubky`, `tokio` or `reqwest`: the CLI owns the network
# (check with `cargo tree -p sweepky-core -e normal`).
[dependencies]
# `derive` brings in `#[derive(Serialize, Deserialize)]`.
serde = { workspace = true, features = ["derive"] }
# Default features only. Never `unbounded_depth`: it turns off the recursion
# limit (128 levels) that stops deeply nested input from overflowing the stack.
serde_json = { workspace = true }
thiserror = { workspace = true }
# Record ids. Always with `base32`: that feature is what makes `Timestamp` read
# and write the 13-character Crockford form. Without it, its `TryFrom<String>`
# slices `value[11..len - 1]` and panics on a short string. Never `serde`: that
# feature serializes a timestamp as 8 raw bytes, not as the id string.
pubky-timestamp = { workspace = true, features = ["base32"] }
# z-base32, the encoding of a pubky. Its `decode` returns `None` on bad input
# rather than panicking.
base32 = { workspace = true }
# age v1 encryption (P1b). No `features` here, so only age's default set, which
# is empty: never `plugin` (it would run external `age-plugin-*` programs, and
# is the code path behind age's one advisory), never `ssh` (it pulls in an
# `rsa` crate with an unpatched advisory) and never `armor` (sweep packages are
# stored as binary). Its `secrecy` re-export, `age::secrecy`, is this crate's
# only route to `SecretString`, so the two can never disagree on a version.
age = { workspace = true }
# `Zeroizing<T>`, a wrapper that overwrites its value with zeros when it is
# dropped, for buffers that held plaintext or key material.
zeroize = { workspace = true }
