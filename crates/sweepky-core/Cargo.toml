[package]
name = "sweepky-core"
description = "Sweepky's records, ids, paths and encryption, with no network or file I/O"
# `field.workspace = true` inherits the value from [workspace.package] in the
# root Cargo.toml.
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Each entry opts in to a pin in the root Cargo.toml's [workspace.dependencies];
# `features` adds to what the workspace entry turns on. This crate never takes
# `pubky`, `tokio` or `reqwest`: the CLI owns the network
# (check with `cargo tree -p sweepky-core -e normal`).
[dependencies]
# `derive` brings in `#[derive(Serialize, Deserialize)]`.
serde = { workspace = true, features = ["derive"] }
# Default features only. Never `unbounded_depth`: it turns off the recursion
# limit (128 levels) that stops deeply nested input from overflowing the stack.
serde_json = { workspace = true }
thiserror = { workspace = true }
